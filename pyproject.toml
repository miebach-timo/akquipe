[project]
name = "akquipe"
version = "0.1.0"
description = "UX/UI Freelancer Akquise-Pipeline: Scrape → Vault → Audit → Rebuild → Package"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.87.0",
    "playwright>=1.50.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.0.0",
    "typer>=0.24.1",
    "rich>=14.0.0",
    "jinja2>=3.1.0",
    "pillow>=11.0.0",
    "python-slugify>=8.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
akquipe = "pipeline:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
